version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ecommerce_mongo
    restart: unless-stopped
    volumes:
      - /opt/ecommerce/data/mongo:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - ecom_net

  backend:
    image: harbor.nodesign.vn/ecommerce/backend:latest
    container_name: ecommerce_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
      - JWT_SECRET=supersecretkey_ecommerce_2026_production
      - NODE_ENV=production
    volumes:
      - /opt/ecommerce/data/uploads:/app/uploads
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - mongodb
    networks:
      - ecom_net

  frontend:
    image: harbor.nodesign.vn/ecommerce/frontend:latest
    container_name: ecommerce_frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - ecom_net

networks:
  ecom_net:
    driver: bridge
